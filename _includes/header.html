<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}, home">{% include mark.svg %}<span>{{ site.title }}</span></a>
    <nav class="nav" aria-label="Site">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="on" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a href="{{ site.github_org }}">GitHub</a>
    </nav>
  </div>
</header>
