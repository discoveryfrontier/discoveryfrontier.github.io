<footer class="foot">
  <div class="wrap foot-inner">
    <div>
      <a class="brand" href="{{ '/' | relative_url }}">{% include mark.svg %}<span>{{ site.title }}</span></a>
      <p>{{ site.tagline }}.</p>
    </div>
    <nav aria-label="Footer">
      {% for item in site.nav %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}
      <a class="gh" href="{{ site.github_org }}" aria-label="{{ site.title }} on GitHub" title="GitHub">{% include github.svg %}</a>
    </nav>
  </div>
</footer>
