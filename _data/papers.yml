# One entry per paper. Within a stage, papers show in the order listed here.
#   id:          kebab-case key: the card's anchor on /research/ and its image, assets/img/papers/<id>.jpg
#   short:       label used on the homepage
#   authors:     in paper order, shown on /team/
#   tldr:        one plain sentence for /research/: what the paper builds and what it finds
#   stage:       a key from _data/stages.yml
#   venue_short: compact venue for the homepage; venue is shown on /research/
# Run `ruby scripts/validate_data.rb` after editing.

# --- Literature ---
- id: scimdr
  short: SciMDR
  title: "SciMDR: Advancing Scientific Multimodal Document Reasoning"
  authors: [Ziyu Chen, Yilun Zhao, Chengye Wang, Rilyn Han, Manasi Patwardhan, Arman Cohan]
  tldr: 300K question–answer pairs with reasoning chains over 20K papers, written for focused passages and then re-embedded in full documents, plus an expert-annotated benchmark.
  venue: ACL 2026
  venue_short: ACL 2026
  year: 2026
  stage: literature
  paper: https://arxiv.org/abs/2603.12249
  code: https://github.com/ziyuuc/SciMDR

- id: sciarena
  short: SciArena
  title: "SciArena: An Open Evaluation Platform for Non-Verifiable Scientific Literature-Grounded Tasks"
  authors: [Yilun Zhao, Kaiyan Zhang, Tiansheng Hu, Sihong Wu, Ronan Le Bras, Charles McGrady, Taira Anderson, Jonathan Bragg, Joseph Chee Chang, Jesse Dodge, Matt Latzke, Yixin Liu, Xiangru Tang, Zihang Wang, Chen Zhao, Hannaneh Hajishirzi, Doug Downey, Arman Cohan]
  tldr: An arena where researchers vote between model answers to literature questions, with over 20,000 votes on 47 models, plus a benchmark for automatic judges.
  venue: NeurIPS 2025 Datasets & Benchmarks
  venue_short: NeurIPS 2025
  note: Spotlight
  year: 2025
  stage: literature
  paper: https://arxiv.org/abs/2507.01001
  code: https://github.com/yale-nlp/SciArena

- id: sciriff
  short: SciRIFF
  title: "SciRIFF: A Resource to Enhance Language Model Instruction-Following over Scientific Literature"
  authors: [David Wadden, Kejian Shi, Jacob Morrison, Alan Li, Aakanksha Naik, Shruti Singh, Nitzan Barzilay, Kyle Lo, Tom Hope, Luca Soldaini, Shannon Zejiang Shen, Doug Downey, Hannaneh Hajishirzi, Arman Cohan]
  tldr: 137K expert-written instructions across 54 literature tasks; fine-tuning on them improves held-out scientific tasks by 70.6% on average.
  venue: EMNLP 2025
  venue_short: EMNLP 2025
  year: 2025
  stage: literature
  paper: https://arxiv.org/abs/2406.07835
  code: https://github.com/allenai/SciRIFF

- id: miss-qa
  short: MISS-QA
  title: "Can Multimodal Foundation Models Understand Schematic Diagrams? An Empirical Study on Information-Seeking QA over Scientific Papers"
  authors: [Yilun Zhao, Chengye Wang, Chuhan Li, Arman Cohan]
  tldr: 3,000 expert-annotated questions about the schematic diagrams in 983 papers; 18 frontier multimodal models still trail human experts.
  venue: Findings of ACL 2025
  venue_short: ACL 2025 Findings
  year: 2025
  stage: literature
  paper: https://aclanthology.org/2025.findings-acl.957/
  code: https://github.com/yilunzhao/MISS-QA

# --- Ideation ---
- id: ideaanchor
  short: IdeaAnchor
  title: "IdeaAnchor: Teaching LLMs to Turn Literature into Research Ideas"
  authors: [Ziyu Chen, Yilun Zhao, Jiashuo Sun, Yiling Ma, Manasi Patwardhan, Arman Cohan]
  tldr: Mines published papers for how their ideas grew out of prior work, and uses that structure to train LLMs to turn a set of papers into a research idea.
  venue: arXiv preprint
  venue_short: arXiv 2026
  year: 2026
  stage: ideation
  paper: https://arxiv.org/abs/2610.08781
  code: https://github.com/ziyuuc/IdeaAnchor

- id: backtrend
  short: BackTrend
  title: "BackTrend: Evaluating Scientific Weak-Signal Prediction via Backward Reconstruction"
  authors: [Xiao Zhou, Yilun Zhao, Owen Jiang, Tiansheng Hu, Cai Xu, Manasi Patwardhan, Arman Cohan]
  tldr: Can systems spot research directions before they become mainstream? 66 validated early signals behind 25 mature AI topics; the best system reaches 10.1% F1.
  venue: Findings of EMNLP 2026
  venue_short: EMNLP 2026 Findings
  year: 2026
  stage: ideation
  paper: https://arxiv.org/abs/2609.24921
  code: https://github.com/rebeccaz4/BackTrend

- id: ideaambig
  short: IdeaAMBIG
  title: "IdeaAMBIG: Benchmarking Implementation-Critical Gaps in Research-Idea Specifications"
  authors: [Yiling Ma, Yilun Zhao, Sihong Wu, Manasi Patwardhan, Arman Cohan]
  tldr: 660 method specifications with gaps that block implementation; across 13 LLMs, finding the gap is the bottleneck, with 9.6% recovered on real-world cases.
  venue: arXiv preprint
  venue_short: arXiv 2026
  year: 2026
  stage: ideation
  paper: https://arxiv.org/abs/2609.10539
  code: https://github.com/Yiling-Ma/IdeaAMBIG

- id: idea-gap
  short: Human–LLM Idea Gap
  title: "Measuring the Gap Between Human and LLM Research Ideas"
  authors: [Ziyu Chen, Yilun Zhao, Arman Cohan]
  tldr: Gives LLMs the prior papers that inspired real research ideas and compares what they propose with what humans did; LLM ideas cover a narrower, shifted range.
  venue: arXiv preprint
  venue_short: arXiv 2026
  year: 2026
  stage: ideation
  paper: https://arxiv.org/abs/2607.01233
  code: https://github.com/ziyuuc/TasteGap

