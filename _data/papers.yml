# --- Critique & review ---
- id: actreview
  short: ActReview
  title: "ActReview: Rebuttal-Guided Training Data and Rubric Rewards for Actionable Peer Review Generation"
  authors: [Yiling Ma, Yilun Zhao, Sihong Wu, Ziyu Chen, Manasi Patwardhan, Arman Cohan]
